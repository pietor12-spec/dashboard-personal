<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1a2b"/>
      <stop offset="1" stop-color="#060b13"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="1" stop-color="#00FFA3"/>
    </linearGradient>
    <linearGradient id="wal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14263d"/>
      <stop offset="1" stop-color="#0c1828"/>
    </linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- cartera -->
  <rect x="88" y="168" width="336" height="236" rx="40" fill="url(#wal)" stroke="url(#neon)" stroke-width="14"/>
  <path d="M120 168 L330 104 Q352 98 358 120 L372 168" fill="none" stroke="url(#neon)" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" opacity=".55"/>
  <!-- cierre -->
  <rect x="344" y="252" width="80" height="68" rx="20" fill="#0a1422" stroke="url(#neon)" stroke-width="12"/>
  <circle cx="374" cy="286" r="11" fill="#00FFA3"/>
  <!-- gráfico ascendente -->
  <polyline points="128,352 182,306 222,326 288,252" fill="none" stroke="url(#neon)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M258 240 L298 240 L298 280" fill="none" stroke="#00FFA3" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
